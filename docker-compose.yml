services:
  mongo:
    image: mongo:7
    container_name: store-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: store
    networks:
      - store-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: store-backend
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/store
      PORT: 3000
      NODE_ENV: development
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - store-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: store-frontend
    ports:
      - "4200:4200"
    environment:
      API_URL: http://localhost:3000/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - store-network

volumes:
  mongo-data:

networks:
  store-network:
    driver: bridge
